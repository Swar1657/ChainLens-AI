version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: chainlens_postgres
    environment:
      POSTGRES_USER: chainlens_user
      POSTGRES_PASSWORD: chainlens_password
      POSTGRES_DB: chainlens_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
