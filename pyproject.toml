[project]
name = "chainlens-ai"
version = "0.1.0"
description = "ChainLens AI Project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastembed>=0.8.0",
    "langchain>=1.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "sqlalchemy>=2.0.52",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
