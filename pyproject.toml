[project]
name = "chainlens-ai"
version = "0.1.0"
description = "ChainLens AI Project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
